---
name: Bug Report
description: Report a bug encountered while using thinkNXG Health
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Welcome to thinkNXG Health issue tracker! Before creating an issue, please consider the following:

        1. This tracker should only be used to report bugs and request features / enhancements to thinkNXG Health
            - For questions and general support, checkout the [documentation](https://docs.thinknxg.com/thinknxghealth) or use the [thinkNXG Support](https://thinknxg.com/thinkdesk) for assistance.
            - For documentation issues, propose edit on the [documentation site](https://docs.thinknxg.com/thinknxghealth) directly.
        2. When making a bug report, make sure you provide all required information. The easier it is for maintainers to reproduce, the faster it'll be fixed.
        3. If you think you know what the reason for the bug is, share it with us. Maybe put in a PR 😉

  - type: textarea
    id: bug-info
    attributes:
      label: Information about bug
      description: Also tell us, what did you expect to happen? If applicable, add screenshots to help explain your problem.
      placeholder: Please provide as much information as possible.
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Module
      description: Select the affected module of thinkNXG Health.
      multiple: true
      options:
        - Outpatient Module
        - Inpatient ADT
        - Diagnostic Module
        - Clinical Procedure
        - Rehab & Physiotherapy
        - Patient History
        - Code Standards
        - Setup / Configuration
        - Integration with thinkNXG ERP modules
        - Regional / Other Integrations
        - Laboratory (legacy)
    validations:
      required: true

  - type: textarea
    id: exact-version
    attributes:
      label: Version
      description: Share exact version number of thinkNXG Framework, thinkNXG ERP and thinkNXG Health you are using.
      placeholder: |
        thinkNXG Framework version -
        thinkNXG ERP version -
        thinkNXG Health version -
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Installation method
      options:
        - thinkNXG Cloud
        - docker
        - easy-install
        - manual install
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output / Stack trace / Full Error Message.
      description: Please copy and paste any relevant log output. This will be automatically formatted.
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: |
        By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/thinknxg/thinkNXG-Health/blob/version-16/CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
...
